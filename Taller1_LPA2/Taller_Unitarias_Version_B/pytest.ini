[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test* Verificacion*
python_functions = test_*
pythonpath = . src tests
addopts = -v --import-mode=importlib --cov=src --cov-report=term-missing --cov-report=html --cov-branch
markers =
    slow: pruebas de larga duracion
    integration: pruebas de integracion
